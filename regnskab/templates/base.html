<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Regnskab{% endblock %}</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f4f5f7; color: #1a1a1a; }
  header { background: #1f2937; color: #fff; padding: 12px 20px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  header a { color: #d1d5db; text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 14px; }
  header a:hover, header a.active { background: #374151; color: #fff; }
  header .logo { font-weight: 700; color: #fff; margin-right: 10px; }
  main { max-width: 1000px; margin: 24px auto; padding: 0 20px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
  th { background: #f9fafb; font-weight: 600; color: #4b5563; }
  tr:last-child td { border-bottom: none; }
  .card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 20px; }
  .btn { display: inline-block; background: #2563eb; color: #fff; padding: 8px 16px; border-radius: 6px; text-decoration: none; border: none; font-size: 14px; cursor: pointer; }
  .btn:hover { background: #1d4ed8; }
  .btn.secondary { background: #6b7280; }
  .btn.danger { background: #dc2626; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; color: #374151; }
  input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 180px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.afventer { background: #fef3c7; color: #92400e; }
  .badge.bogfoert { background: #d1fae5; color: #065f46; }
  .badge.afvist { background: #fee2e2; color: #991b1b; }
  .badge.aaben { background: #dbeafe; color: #1e40af; }
  .badge.forfalden { background: #fee2e2; color: #991b1b; }
  .fejl { background: #fee2e2; color: #991b1b; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
  .muted { color: #6b7280; font-size: 13px; }
</style>
</head>
<body>
<header>
  <span class="logo">📒 Regnskab</span>
  <a href="/bilag">Bilag</a>
  <a href="/debitorer">Debitor</a>
  <a href="/kreditorer">Kreditor</a>
  <a href="/bank">Bank</a>
  <a href="/posteringer">Posteringer</a>
  <span style="flex:1"></span>
  <a href="/logout">Log ud</a>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
