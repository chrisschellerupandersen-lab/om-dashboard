<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log ind — Regnskab</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1f2937; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  form { background: #fff; padding: 32px; border-radius: 10px; width: 280px; box-shadow: 0 4px 20px rgba(0,0,0,.3); }
  h1 { font-size: 18px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  input { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
  button { width: 100%; margin-top: 20px; background: #2563eb; color: #fff; border: none; padding: 10px; border-radius: 6px; font-size: 14px; cursor: pointer; }
  .fejl { background: #fee2e2; color: #991b1b; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>📒 Regnskab — log ind</h1>
  {% if fejl %}<div class="fejl">{{ fejl }}</div>{% endif %}
  <label>Brugernavn</label>
  <input name="brugernavn" required autofocus>
  <label>Adgangskode</label>
  <input name="password" type="password" required>
  <button type="submit">Log ind</button>
</form>
</body>
</html>
