{% extends "base.html" %}
{% block title %}Ny kreditor — Nimbo Regnskab{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Ny kreditor</h1><div class="sub">Leverandør</div></div></div>
<div class="card" style="max-width:520px;">
  {% if fejl %}<div class="fejl">{{ fejl }}</div>{% endif %}
  <form method="post" action="/kreditorer/ny">
    <div class="row">
      <div><label>Navn</label><input name="navn" id="navn" required></div>
      <div>
        <label>CVR</label>
        <div style="display:flex; gap:8px;">
          <input name="cvr" id="cvr" placeholder="8 cifre">
          <button type="button" class="btn secondary" id="cvr-slaa-op" style="white-space:nowrap;">Slå op</button>
        </div>
      </div>
    </div>
    <div id="cvr-status" class="muted" style="min-height:16px; margin-top:2px;"></div>
    <label>Adresse</label>
    <input name="adresse" id="adresse">
    <label>Email</label>
    <input name="email" type="email">
    <div class="row">
      <div><label>IBAN</label><input name="iban" placeholder="Til betalingsfil, valgfrit"></div>
      <div><label>BIC/SWIFT</label><input name="bic" placeholder="Valgfrit"></div>
    </div>
    <div style="margin-top:20px;">
      <button class="btn" type="submit">Opret</button>
    </div>
  </form>
</div>
<script>
document.getElementById('cvr-slaa-op').addEventListener('click', async function () {
  var cvrInput = document.getElementById('cvr');
  var status = document.getElementById('cvr-status');
  var cvr = cvrInput.value.replace(/\D/g, '');
  if (cvr.length !== 8) { status.textContent = 'CVR skal være 8 cifre'; status.style.color = 'var(--bad)'; return; }
  status.textContent = 'Slår op…'; status.style.color = 'var(--muted)';
  try {
    var r = await fetch('/api/cvr/' + cvr);
    var data = await r.json();
    if (!data.ok) { status.textContent = data.fejl || 'Kunne ikke finde CVR'; status.style.color = 'var(--bad)'; return; }
    document.getElementById('navn').value = data.navn;
    document.getElementById('adresse').value = data.adresse;
    status.textContent = 'Fundet: ' + data.navn; status.style.color = 'var(--good)';
  } catch (e) {
    status.textContent = 'Fejl ved opslag'; status.style.color = 'var(--bad)';
  }
});
</script>
{% endblock %}
