<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log ind — Nimbo Regnskab</title>
<style>
  :root {
    --bg: #F6F7F9; --surface: #FFFFFF; --border: #E4E7EC;
    --text: #14171C; --muted: #6E7681; --accent: #2F6FED; --accent-soft: #EAF1FE;
    --bad: #E5484D; --bad-soft: #FCEAEA;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    background: var(--bg); display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; color: var(--text);
  }
  .panel { width: 320px; text-align: center; }
  .logo-mark { margin: 0 auto 18px; }
  .word { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 2px; }
  .tag { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 28px; }
  form {
    background: var(--surface); border: 1px solid var(--border); padding: 28px;
    border-radius: 16px; box-shadow: 0 1px 2px rgba(20,23,28,.04), 0 16px 32px -18px rgba(20,23,28,.18);
    text-align: left;
  }
  label { display: block; font-size: 12.5px; font-weight: 600; margin: 14px 0 5px; color: var(--muted); }
  label:first-child { margin-top: 0; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
    font-size: 14px; box-sizing: border-box; font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  button {
    width: 100%; margin-top: 20px; background: var(--accent); color: #fff; border: none;
    padding: 11px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  button:hover { background: #2A5FD1; }
  .fejl { background: var(--bad-soft); color: #9A1E22; padding: 9px 13px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="panel">
  <svg class="logo-mark" width="40" height="40" viewBox="0 0 34 34" fill="none">
    <circle cx="17" cy="6.5" r="2.1" fill="#2F6FED"/>
    <path d="M7 15c0-3.5 3-6 7-6h6c4 0 7 2.5 7 6 0 3.6-3.2 6.5-7.2 6.5H14.2C10.2 21.5 7 18.6 7 15z" stroke="#2F6FED" stroke-width="1.8" fill="#EAF1FE"/>
    <text x="17" y="18.5" font-family="-apple-system,Segoe UI,sans-serif" font-size="9" font-weight="700" fill="#2F6FED" text-anchor="middle">N</text>
  </svg>
  <div class="word">Nimbo</div>
  <div class="tag">Regnskab</div>
  <form method="post" action="/login">
    {% if fejl %}<div class="fejl">{{ fejl }}</div>{% endif %}
    <label>Brugernavn</label>
    <input name="brugernavn" required autofocus>
    <label>Adgangskode</label>
    <input name="password" type="password" required>
    <button type="submit">Log ind</button>
  </form>
</div>
</body>
</html>
